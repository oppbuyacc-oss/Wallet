<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wallet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Wallet</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><text x='50' y='65' text-anchor='middle' font-size='62' fill='white'>W</text></svg>">
  <style>
:root{
  --bg:#f6f6f8;--panel:#fff;--text:#111114;--muted:#6e6e73;--blue:#007aff;--line:#e4e4e9;--green:#34c759;--red:#ff3b30;--shadow:0 16px 44px rgba(0,0,0,.13);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#222}body{display:flex;align-items:center;justify-content:center;padding:18px;color:var(--text)}button{font:inherit}
.device-shell{width:min(390px,100vw);height:min(844px,100vh);min-height:650px;background:var(--bg);border:0;border-radius:0;overflow:hidden;position:relative;box-shadow:none}
.statusbar{display:none}
#app{height:calc(100% - 62px);overflow:auto;padding:24px 18px 30px;-webkit-overflow-scrolling:touch}.screen{min-height:100%;position:relative}
.page-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 16px}.title{font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-1.1px;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}.head-action{width:32px;height:32px;border:0;border-radius:50%;background:#e8e8ed;display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;color:#111;cursor:pointer}.head-action.blue{background:var(--blue);color:#fff}.head-action.blue svg{display:block;width:16px;height:16px}
.card-wrap{perspective:1200px;margin:6px 0 20px}.wallet-card{width:100%;aspect-ratio:960/608;border-radius:20px;overflow:hidden;position:relative;background:#dfe6dd;box-shadow:var(--shadow);transition:transform .45s,filter .3s}.wallet-card img{width:100%;height:100%;display:block;object-fit:cover}.wallet-card.locked img{filter:blur(5px) grayscale(.22) brightness(.68)}
.card-sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}.wallet-card.tap .card-sheen{animation:sheen 1.35s ease}.lock-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;background:linear-gradient(to top,rgba(0,0,0,.35),transparent 55%);color:#fff;font-size:13px;font-weight:700}.lock-pill{backdrop-filter:blur(14px);background:rgba(18,18,18,.62);border:1px solid rgba(255,255,255,.15);padding:8px 12px;border-radius:18px}.card-caption{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.subtle{color:var(--muted);font-size:13px}.strong{font-weight:700}
.action-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 18px}.action{border:0;border-radius:15px;padding:14px 12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);font-weight:700;cursor:pointer;transition:transform .15s,background .15s}.action:active{transform:scale(.98);background:#f0f0f4}.action.primary{background:#111;color:#fff}
.section{background:var(--panel);border-radius:18px;overflow:hidden;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}.row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .grow{flex:1}.row h3,.row p{margin:0}.row h3{font-size:15px}.row p{color:var(--muted);font-size:12px;margin-top:3px}.chev{color:#a1a1a6;font-size:21px}.round-icon{width:40px;height:40px;border-radius:12px;background:#f0f0f4;display:grid;place-items:center;font-size:18px}.merchant{display:flex;align-items:center;justify-content:space-between}.amt{font-weight:700}.positive{color:var(--green)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:62px;border-top:1px solid #dedee4;background:rgba(251,251,253,.94);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-around}.tab{border:0;background:none;color:#8d8d93;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}.tab.active{color:#111}.tab-icon{font-size:19px;line-height:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;padding:18px;z-index:20}.sheet{width:min(390px,100%);border-radius:28px;background:#f7f7fa;padding:12px 18px 22px;box-shadow:0 20px 80px rgba(0,0,0,.35);animation:slideUp .25s ease}.grab{width:38px;height:5px;background:#c5c5c9;border-radius:5px;margin:0 auto 18px}.sheet h2{font-size:23px;margin:4px 0 8px}.sheet p{font-size:14px;line-height:1.4;color:var(--muted)}
.faceid{display:grid;place-items:center;padding:14px 0 10px}.faceid-ring{width:104px;height:104px;border-radius:28px;border:3px solid #1677ff;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(0,122,255,.07);animation:pulse 1.5s infinite}.face{font-size:42px}.verify-btn{width:100%;border:0;border-radius:14px;padding:13px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.ghost-btn{width:100%;border:0;background:transparent;color:var(--blue);padding:13px;cursor:pointer}.keyline{display:flex;gap:8px;align-items:center;margin:12px 0;color:#6e6e73;font-size:12px}.keyline:before,.keyline:after{content:"";height:1px;background:#d8d8dc;flex:1}
.tap-zone{height:230px;border-radius:24px;background:radial-gradient(circle at 50% 55%,#fff 0,#ececf1 42%,#dbdbe0 100%);display:grid;place-items:center;position:relative;overflow:hidden}.nfc-ring{width:150px;height:150px;border-radius:50%;border:3px solid #111;display:grid;place-items:center;position:relative}.nfc-ring:before,.nfc-ring:after{content:"";position:absolute;border:2px solid #111;border-radius:50%;inset:16px;opacity:.55}.nfc-ring:after{inset:34px;opacity:.28}.nfc-logo{font-size:34px;font-weight:800}.pulse-ring{position:absolute;border:2px solid var(--blue);border-radius:50%;width:80px;height:80px;animation:radar 1.6s infinite;opacity:0}.tap-copy{text-align:center;margin:16px 0}.tap-copy h2{margin:0 0 6px;font-size:21px}.tap-copy p{margin:0;color:var(--muted)}
.success{display:grid;place-items:center;text-align:center;padding:26px 6px}.success-mark{width:84px;height:84px;border-radius:50%;background:rgba(52,199,89,.15);color:var(--green);display:grid;place-items:center;font-size:46px;font-weight:500;animation:pop .3s ease}.success h2{font-size:28px;margin:16px 0 6px}.success p{margin:0;color:var(--muted);line-height:1.4}.receipt{width:100%;background:#fff;border-radius:18px;margin-top:18px;padding:16px;text-align:left}.receipt .line{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}.receipt .total{font-size:18px;font-weight:800;padding-top:12px;margin-top:6px;border-top:1px dashed #d2d2d7}.center{text-align:center}.wide{width:100%}
.toggle{margin-left:auto;width:50px;height:30px;border-radius:18px;background:#bbb;position:relative;cursor:pointer;transition:.2s}.toggle.on{background:var(--green)}.toggle:after{content:"";width:26px;height:26px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:.2s}.toggle.on:after{left:22px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);opacity:0;background:rgba(20,20,22,.9);color:#fff;padding:10px 14px;border-radius:18px;font-size:13px;z-index:40;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(0,122,255,.08)}}@keyframes radar{0%{transform:scale(.65);opacity:.7}100%{transform:scale(1.55);opacity:0}}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes sheen{to{transform:translateX(130%)}}@media(max-height:730px){.device-shell{height:calc(100vh - 18px)}.tap-zone{height:190px}}

</style>
</head>

const STORAGE_KEY = 'sh4rky-wallet-state';
const base = { unlocked:false, tab:'wallet', sound:true, lastPayment:null, transactions:[
  {merchant:'AMEX Market', amount:'€24.80', date:'Today, 18:48', status:'Completed'},
  {merchant:'Coffee & Co.', amount:'€6.40', date:'Today, 09:14', status:'Completed'},
  {merchant:'Transit', amount:'€3.20', date:'Yesterday', status:'Completed'},
]};
let state = load();
const app = document.getElementById('app');
const toast = document.getElementById('toast');

document.addEventListener('click', (e)=>{
  const nav=e.target.closest('[data-nav]'); if(nav){state.tab=nav.dataset.nav; save(); render(); return;}
  const act=e.target.closest('[data-action]'); if(!act) return;
  handle(act.dataset.action);
});

function load(){try{return {...base,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch{return {...base}}}
function save(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state))}
function esc(v){return String(v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nowTime(){return new Intl.DateTimeFormat('en-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function formatCard(){return state.unlocked?'•••• 7997':'•••• 7997'}
function cardHTML(){return `<div class="card-wrap"><div class="wallet-card ${state.unlocked?'':'locked'}" id="card"><img src="${CARD_IMG}" alt="American Express Business card"><div class="card-sheen"></div>${!state.unlocked?'<div class="lock-overlay"><span class="lock-pill">Face ID required</span></div>':''}</div><div class="card-caption"><div><div class="strong">AMERICAN EXPRESS</div><div class="subtle">Business · ${formatCard()}</div></div><button class="head-action" data-action="details" aria-label="Card details">›</button></div></div>`}

function render(){
  if(state.tab==='wallet') renderWallet();
  else if(state.tab==='activity') renderActivity();
  else renderSettings();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.tab));
}
function renderWallet(){app.innerHTML=`<section class="screen"><div class="page-head"><h1 class="title">Wallet</h1><button class="head-action blue" data-action="add" aria-label="Add card"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3.5v13M3.5 10h13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></div>${cardHTML()}<div class="action-row"><button class="action primary" data-action="pay">${state.unlocked?'Pay with card':'Unlock to pay'}</button><button class="action" data-action="unlock">${state.unlocked?'Lock card':'Face ID'}</button></div><div class="section"><div class="row" data-action="details"><div class="round-icon">▤</div><div class="grow"><h3>Card details</h3><p>American Express Business</p></div><div class="chev">›</div></div><div class="row" data-action="transactions"><div class="round-icon">↻</div><div class="grow"><h3>Latest transactions</h3><p>${state.transactions.length} entries</p></div><div class="chev">›</div></div><div class="row" data-action="verification"><div class="round-icon">✓</div><div class="grow"><h3>Verification & security</h3><p>Face ID · Device verification</p></div><div class="chev">›</div></div></div><div class="section"><div class="row"><div class="round-icon">⌁</div><div class="grow"><h3>Hold near reader</h3><p>Contactless payment</p></div><div class="chev">›</div></div></div></section>`}
function renderActivity(){app.innerHTML=`<section class="screen"><div class="page-head"><h1 class="title">Activity</h1><button class="head-action" data-action="clear">⌫</button></div><div class="section">${state.transactions.map((t,i)=>`<div class="row"><div class="round-icon">${i===0?'A':i===1?'☕':'↕'}</div><div class="grow"><h3>${esc(t.merchant)}</h3><p>${esc(t.date)} · ${esc(t.status)}</p></div><div class="amt">${esc(t.amount)}</div></div>`).join('')}</div><div class="subtle center" style="padding:16px">Payment history</div></section>`}
function renderSettings(){app.innerHTML=`<section class="screen"><div class="page-head"><h1 class="title">Settings</h1></div><div class="section"><div class="row" data-action="unlock"><div class="round-icon">⌁</div><div class="grow"><h3>Face ID</h3><p>${state.unlocked?'Card unlocked':'Unlock card before payment'}</p></div><div class="toggle ${state.unlocked?'on':''}"></div></div><div class="row" data-action="sound"><div class="round-icon">♫</div><div class="grow"><h3>Confirmation sound</h3><p>Play confirmation tone</p></div><div class="toggle ${state.sound?'on':''}"></div></div></div><div class="section"><div class="row" data-action="details"><div class="round-icon">▣</div><div class="grow"><h3>Card information</h3><p>•••• 7997 · American Express Business</p></div><div class="chev">›</div></div><div class="row" data-action="verification"><div class="round-icon">✓</div><div class="grow"><h3>Verification messages</h3><p>View security confirmations</p></div><div class="chev">›</div></div></div><div class="section"><div class="row" data-action="reset"><div class="round-icon">↺</div><div class="grow"><h3>Reset Wallet</h3><p>Clear activity and lock the card</p></div><div class="chev">›</div></div></div></section>`}

function sheet(inner){const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=`<div class="sheet">${inner}</div>`;wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});document.body.appendChild(wrap);return wrap}
function closeSheet(el){el?.remove()}

async function doUnlock(){const modal=sheet(`<div class="grab"></div><div class="faceid"><div class="faceid-ring"><div class="face">◌</div></div></div><div class="center"><h2>Face ID</h2><p>Confirm to unlock the card. This is a Use Face ID to unlock the card.</p></div><button class="verify-btn" data-action="confirm-unlock">Continue</button><button class="ghost-btn" data-action="cancel">Cancel</button>`);modal.querySelector('[data-action="confirm-unlock"]').onclick=()=>{state.unlocked=true;save();closeSheet(modal);playTone();render();showToast('Card unlocked');};modal.querySelector('[data-action="cancel"]').onclick=()=>closeSheet(modal)}
function cardDetails(){sheet(`<div class="grab"></div><h2>Card details</h2><div class="section"><div class="row"><div class="grow"><h3>AMERICAN EXPRESS</h3><p>Business Card</p></div><b>•••• 7997</b></div><div class="row"><div class="grow"><h3>Status</h3><p>${state.unlocked?'Unlocked':'Locked'}</p></div></div><div class="row"><div class="grow"><h3>Network</h3><p>Contactless · NFC</p></div></div></div><button class="verify-btn" data-action="close">Done</button>`)}
function verification(){sheet(`<div class="grab"></div><h2>Verification</h2><p>Every payment flow includes a verification step before the reader starts.</p><div class="section"><div class="row"><div class="round-icon">✓</div><div class="grow"><h3>Device verification</h3><p>Required before the payment sheet</p></div></div><div class="row"><div class="round-icon">⌁</div><div class="grow"><h3>Contactless reader</h3><p>Contactless reader</p></div></div><div class="row"><div class="round-icon">✓</div><div class="grow"><h3>Confirmation</h3><p>Receipt and transaction status are shown on success</p></div></div></div><button class="verify-btn" data-action="close">Done</button>`)}
function transactions(){sheet(`<div class="grab"></div><h2>Recent transactions</h2><div class="section">${state.transactions.map(t=>`<div class="row"><div class="round-icon">•</div><div class="grow"><h3>${esc(t.merchant)}</h3><p>${esc(t.date)} · ${esc(t.status)}</p></div><b>${esc(t.amount)}</b></div>`).join('')}</div><button class="verify-btn" data-action="close">Done</button>`)}

function pay(){if(!state.unlocked){showToast('Unlock the card first');doUnlock();return}const modal=sheet(`<div class="grab"></div><div class="center"><div class="tap-zone"><div class="nfc-ring"><div class="nfc-logo">⌁</div><div class="pulse-ring"></div></div></div><div class="tap-copy"><h2>Hold near reader</h2><p>Keep the card area close to the reader.</p></div><button class="verify-btn" data-action="start-tap">Scan reader</button><button class="ghost-btn" data-action="cancel">Cancel</button></div>`);modal.querySelector('[data-action="start-tap"]').onclick=()=>{modal.querySelector('.tap-zone').innerHTML='<div class="nfc-ring"><div class="nfc-logo">⌁</div><div class="pulse-ring"></div></div>';modal.querySelector('h2').textContent='Reading…';modal.querySelector('p').textContent='Verifying card and preparing authorization…';modal.querySelector('[data-action="start-tap"]').disabled=true;setTimeout(()=>completePayment(modal),1300)};modal.querySelector('[data-action="cancel"]').onclick=()=>closeSheet(modal)}
function randomPaymentAmount(){const cents=Math.floor(Math.random()*2501)+1000;return `€${(cents/100).toFixed(2)}`}
function completePayment(modal){const amount=randomPaymentAmount();const fee='2,58 €';state.lastPayment={amount,fee,merchant:'Market',at:new Date().toISOString()};state.transactions=[{merchant:'Market',amount,fee,date:'Just now',status:'Completed'},...state.transactions];save();playTone();modal.querySelector('.sheet').innerHTML=`<div class="grab"></div><div class="success"><div class="success-mark">✓</div><h2>Payment approved</h2><p>Your transaction completed successfully.</p><div class="receipt"><div class="line"><span>Merchant</span><strong>Market</strong></div><div class="line"><span>Method</span><span>AMEX •••• 7997</span></div><div class="line"><span>Status</span><span class="positive">Completed</span></div><div class="line"><span>American Express fees</span><span>${fee}</span></div><div class="line total"><span>Total</span><span>${amount}</span></div></div></div><button class="verify-btn" data-action="close">Done</button>`}
function playTone(){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(1320,c.currentTime+.13);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.32);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.34);setTimeout(()=>c.close(),500)}catch{}}
function clearTransactions(){state.transactions=[];save();render();showToast('Activity cleared')}
function reset(){state={...base};save();render();showToast('Wallet reset')}
function handle(a){switch(a){case'add':showToast('Add Card is not available on this device');break;case'unlock':if(state.unlocked){state.unlocked=false;save();render();showToast('Card locked')}else doUnlock();break;case'pay':pay();break;case'details':cardDetails();break;case'verification':verification();break;case'transactions':transactions();break;case'sound':state.sound=!state.sound;save();render();showToast(state.sound?'Sound enabled':'Sound disabled');break;case'confirm-unlock':break;case'close':document.querySelector('.modal-backdrop')?.remove();break;case'cancel':document.querySelector('.modal-backdrop')?.remove();break;case'clear':clearTransactions();break;case'reset':reset();break;}}
render();

</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }</script>
